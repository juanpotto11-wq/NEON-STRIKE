name: Build NEON STRIKE APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  GODOT_VERSION: "4.3.0"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar herramientas Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "build-tools;33.0.2" \
            "platforms;android-33" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Instalar Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true

      - name: Configurar rutas Android
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Comprobar proyecto
        working-directory: NEON_STRIKE_V3_APK_READY
        run: |
          godot --version
          echo "Proyecto:"
          ls -la
          echo "Preset Android:"
          cat export_presets.cfg

      - name: Importar proyecto
        working-directory: NEON_STRIKE_V3_APK_READY
        run: |
          godot --headless --editor --quit

      - name: Exportar APK
        working-directory: NEON_STRIKE_V3_APK_READY
        run: |
          mkdir -p build/android
          godot --headless --verbose \
            --export-release "Android" \
            build/android/NEON_STRIKE.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON_STRIKE-Android
          path: NEON_STRIKE_V3_APK_READY/build/android/NEON_STRIKE.apk
          if-no-files-found: error
